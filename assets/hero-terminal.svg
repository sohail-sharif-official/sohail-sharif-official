<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" fill="none">
  <defs>
    <linearGradient id="heroBg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0a0e14"/>
      <stop offset="55%" stop-color="#10141a"/>
      <stop offset="100%" stop-color="#141a24"/>
    </linearGradient>
    <radialGradient id="glowCyan" cx="0.12" cy="0.15" r="0.45">
      <stop offset="0%" stop-color="#8ed5ff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#8ed5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowGreen" cx="0.88" cy="0.85" r="0.45">
      <stop offset="0%" stop-color="#4edea3" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#4edea3" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Outer Card -->
  <rect width="1200" height="420" rx="16" fill="url(#heroBg)" stroke="#262a31" stroke-width="1.5"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowCyan)"/>
  <rect width="1200" height="420" rx="16" fill="url(#glowGreen)"/>

  <!-- Top Terminal Header Bar -->
  <rect x="1" y="1" width="1198" height="48" rx="15" fill="#141820"/>
  <line x1="0" y1="49" x2="1200" y2="49" stroke="#262a31" stroke-width="1"/>
  <circle cx="28" cy="25" r="6" fill="#ffb4ab"/>
  <circle cx="48" cy="25" r="6" fill="#7bd0ff"/>
  <circle cx="68" cy="25" r="6" fill="#4edea3"/>
  <text x="92" y="29" fill="#87929a" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12.5" font-weight="600">bash - session ~ systems-architect // sohail-sharif-official</text>

  <!-- Right Status Pill -->
  <rect x="850" y="12" width="230" height="26" rx="13" fill="#1c2026" stroke="#31353c" stroke-width="1"/>
  <circle cx="868" cy="25" r="4" fill="#4edea3">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="880" y="29" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Available for Senior/Staff Roles</text>
  <text x="1100" y="29" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="12" font-weight="600">UTC-5 [EST]</text>

  <!-- Prompt Line -->
  <text x="44" y="92" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="13.5" font-weight="600">$ whoami --architect --production-ready</text>

  <!-- Name -->
  <text x="44" y="148" fill="#dfe2eb" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">Sohail Sharif</text>

  <!-- Subtitle + Blinking Cursor -->
  <text x="44" y="184" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="17.5" font-weight="600">Senior Software Engineer // Distributed Systems &amp; Cloud-Native Architect</text>
  <rect x="815" y="168" width="10" height="20" fill="#8ed5ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Executive Bio Narrative -->
  <text x="44" y="226" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5">Principal-level backend &amp; full-stack engineer with 9+ years of production experience architecting deterministic</text>
  <text x="44" y="250" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5">financial ledgers, distributed transactional sagas, tenant-isolated cloud engines, and high-throughput event</text>
  <text x="44" y="274" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="15.5">pipelines across Kubernetes (EKS/AKS), C# / .NET, Java 21, Python, Go, TypeScript, and modern cloud topologies.</text>

  <!-- 4 Key Metric Cards -->
  <!-- Card 1 -->
  <g transform="translate(44, 308)">
    <rect width="262" height="76" rx="10" fill="#1c2026" stroke="#31353c" stroke-width="1"/>
    <text x="20" y="36" fill="#8ed5ff" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">9+ YRS</text>
    <text x="20" y="58" fill="#bdc8d1" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">PRODUCTION ENGINEERING</text>
  </g>
  <!-- Card 2 -->
  <g transform="translate(324, 308)">
    <rect width="262" height="76" rx="10" fill="#1c2026" stroke="#31353c" stroke-width="1"/>
    <text x="20" y="36" fill="#4edea3" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">99.99%</text>
    <text x="20" y="58" fill="#bdc8d1" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">LEDGER &amp; API UPTIME</text>
  </g>
  <!-- Card 3 -->
  <g transform="translate(604, 308)">
    <rect width="262" height="76" rx="10" fill="#1c2026" stroke="#31353c" stroke-width="1"/>
    <text x="20" y="36" fill="#c5c9ff" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">KAFKA / gRPC</text>
    <text x="20" y="58" fill="#bdc8d1" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">HIGH-THROUGHPUT MESH</text>
  </g>
  <!-- Card 4 -->
  <g transform="translate(884, 308)">
    <rect width="272" height="76" rx="10" fill="#1c2026" stroke="#31353c" stroke-width="1"/>
    <text x="20" y="36" fill="#7bd0ff" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="24" font-weight="800">ZERO</text>
    <text x="20" y="58" fill="#bdc8d1" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">DOWNTIME EKS / AKS RELEASES</text>
  </g>
</svg>