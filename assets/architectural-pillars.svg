<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" fill="none">
  <rect width="1200" height="310" rx="16" fill="#10141a"/>
  <!-- Section Header -->
  <rect x="16" y="14" width="10" height="22" rx="3" fill="#8ed5ff"/>
  <text x="36" y="31" fill="#dfe2eb" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="700">Core Architectural Pillars</text>
  <text x="1030" y="30" fill="#87929a" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11.5" font-weight="600" letter-spacing="0.8">3 SYSTEM DISCIPLINES</text>

  <!-- Pillar 1 -->
  <g transform="translate(16, 52)">
    <rect width="376" height="242" rx="12" fill="#1c2026" stroke="#262a31" stroke-width="1.5"/>
    <rect x="22" y="20" width="42" height="42" rx="8" fill="#8ed5ff" fill-opacity="0.12"/>
    <text x="34" y="47" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="18" font-weight="700">{}</text>
    <text x="22" y="90" fill="#dfe2eb" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">System Architecture &amp; Backend</text>
    <text x="22" y="118" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">High-concurrency APIs, multi-tenant isolation</text>
    <text x="22" y="138" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">guardrails, double-entry financial ledgers, and</text>
    <text x="22" y="158" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">distributed sagas across microservice topologies.</text>
    <!-- Tags -->
    <rect x="22" y="192" width="82" height="26" rx="5" fill="#8ed5ff" fill-opacity="0.12"/>
    <text x="32" y="209" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">C# / .NET 9</text>
    <rect x="112" y="192" width="66" height="26" rx="5" fill="#8ed5ff" fill-opacity="0.12"/>
    <text x="122" y="209" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Java 21</text>
    <rect x="186" y="192" width="84" height="26" rx="5" fill="#8ed5ff" fill-opacity="0.12"/>
    <text x="196" y="209" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">PostgreSQL</text>
    <rect x="278" y="192" width="76" height="26" rx="5" fill="#8ed5ff" fill-opacity="0.12"/>
    <text x="288" y="209" fill="#8ed5ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Go / Python</text>
  </g>

  <!-- Pillar 2 -->
  <g transform="translate(412, 52)">
    <rect width="376" height="242" rx="12" fill="#1c2026" stroke="#262a31" stroke-width="1.5"/>
    <rect x="22" y="20" width="42" height="42" rx="8" fill="#4edea3" fill-opacity="0.12"/>
    <text x="33" y="47" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="18" font-weight="700">☁</text>
    <text x="22" y="90" fill="#dfe2eb" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Cloud &amp; Platform Reliability</text>
    <text x="22" y="118" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">Zero-downtime Kubernetes deployments, immutable</text>
    <text x="22" y="138" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">Terraform infrastructure-as-code, GitOps via ArgoCD,</text>
    <text x="22" y="158" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">and comprehensive OpenTelemetry SLO alerting.</text>
    <!-- Tags -->
    <rect x="22" y="192" width="106" height="26" rx="5" fill="#4edea3" fill-opacity="0.12"/>
    <text x="32" y="209" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Kubernetes EKS</text>
    <rect x="136" y="192" width="78" height="26" rx="5" fill="#4edea3" fill-opacity="0.12"/>
    <text x="146" y="209" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Terraform</text>
    <rect x="222" y="192" width="66" height="26" rx="5" fill="#4edea3" fill-opacity="0.12"/>
    <text x="232" y="209" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">ArgoCD</text>
    <rect x="296" y="192" width="62" height="26" rx="5" fill="#4edea3" fill-opacity="0.12"/>
    <text x="306" y="209" fill="#4edea3" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">AWS/Az</text>
  </g>

  <!-- Pillar 3 -->
  <g transform="translate(808, 52)">
    <rect width="376" height="242" rx="12" fill="#1c2026" stroke="#262a31" stroke-width="1.5"/>
    <rect x="22" y="20" width="42" height="42" rx="8" fill="#c5c9ff" fill-opacity="0.12"/>
    <text x="34" y="47" fill="#c5c9ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="18" font-weight="700">⚡</text>
    <text x="22" y="90" fill="#dfe2eb" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="700">Event-Driven &amp; AI Integration</text>
    <text x="22" y="118" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">Dead-letter isolated streaming pipelines, transactional</text>
    <text x="22" y="138" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">outboxes, rate-limited worker fan-out, and enterprise</text>
    <text x="22" y="158" fill="#bdc8d1" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13.5">tenant-isolated RAG &amp; LLM query orchestrations.</text>
    <!-- Tags -->
    <rect x="22" y="192" width="96" height="26" rx="5" fill="#c5c9ff" fill-opacity="0.12"/>
    <text x="32" y="209" fill="#c5c9ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Apache Kafka</text>
    <rect x="126" y="192" width="76" height="26" rx="5" fill="#c5c9ff" fill-opacity="0.12"/>
    <text x="136" y="209" fill="#c5c9ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">RabbitMQ</text>
    <rect x="210" y="192" width="54" height="26" rx="5" fill="#c5c9ff" fill-opacity="0.12"/>
    <text x="220" y="209" fill="#c5c9ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">Redis</text>
    <rect x="272" y="192" width="84" height="26" rx="5" fill="#c5c9ff" fill-opacity="0.12"/>
    <text x="282" y="209" fill="#c5c9ff" font-family="'JetBrains Mono', 'Fira Code', Consolas, 'Courier New', monospace" font-size="11" font-weight="600">OpenAI RAG</text>
