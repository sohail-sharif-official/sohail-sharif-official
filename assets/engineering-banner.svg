<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">Sohail Sharif — Senior Software Engineer</title>
  <desc id="bannerDesc">Distributed Systems, Cloud-Native Architecture, Enterprise Backend and Full-Stack Engineering</desc>
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#111c35"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#334155" opacity="0.55"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" rx="16" fill="url(#bgGrad)"/>
  <rect width="1280" height="360" rx="16" fill="url(#dotGrid)"/>

  <!-- Top Accent Bar -->
  <rect x="0" y="0" width="1280" height="4" rx="2" fill="url(#accentGrad)"/>

  <!-- Ambient Glows -->
  <circle cx="1050" cy="110" r="180" fill="#38bdf8" opacity="0.06"/>
  <circle cx="920" cy="260" r="150" fill="#818cf8" opacity="0.06"/>

  <!-- Left Content -->
  <!-- Status Pill -->
  <rect x="64" y="48" width="430" height="30" rx="15" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <circle cx="84" cy="63" r="4.5" fill="#34d399"/>
  <text x="98" y="68" fill="#cbd5e1" font-family="'Segoe UI', Inter, Roboto, Arial, sans-serif" font-size="11.5" font-weight="600" letter-spacing="1.6">SENIOR SOFTWARE ENGINEER  •  9+ YRS EXP</text>

  <!-- Name & Title -->
  <text x="64" y="148" fill="#f8fafc" font-family="'Segoe UI', Inter, Roboto, Arial, sans-serif" font-size="58" font-weight="800" letter-spacing="-0.5">Sohail Sharif</text>
  <text x="64" y="192" fill="#38bdf8" font-family="'Segoe UI', Inter, Roboto, Arial, sans-serif" font-size="22" font-weight="600">Distributed Systems · Cloud-Native Backend · Full-Stack Architecture</text>

  <!-- Divider -->
  <line x1="64" y1="218" x2="720" y2="218" stroke="#1e293b" stroke-width="2"/>

  <!-- Tagline -->
  <text x="64" y="252" fill="#94a3b8" font-family="'Segoe UI', Inter, Roboto, Arial, sans-serif" font-size="15.5">Architecting high-throughput APIs, resilient microservices, event-driven pipelines &amp; cloud platforms.</text>

  <!-- Metric Badges Row -->
  <g transform="translate(64, 276)">
    <rect x="0" y="0" width="190" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="16" y="18" fill="#38bdf8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CORE STACKS</text>
    <text x="16" y="34" fill="#f1f5f9" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600">Python · Go · Java · C# · TS</text>

    <rect x="204" y="0" width="200" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="220" y="18" fill="#818cf8" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">CLOUD &amp; INFRA</text>
    <text x="220" y="34" fill="#f1f5f9" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600">AWS · Azure · K8s · Terraform</text>

    <rect x="418" y="0" width="210" height="42" rx="8" fill="url(#cardGrad)" stroke="#334155" stroke-width="1"/>
    <text x="434" y="18" fill="#34d399" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1">RELIABILITY</text>
    <text x="434" y="34" fill="#f1f5f9" font-family="'Segoe UI', Inter, Arial, sans-serif" font-size="12.5" font-weight="600">99.95% SLA · Multi-Tenant</text>
  </g>

  <!-- Right Side Architecture Topology Diagram -->
  <g transform="translate(790, 46)">
    <rect x="0" y="0" width="430" height="272" rx="12" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>
    <!-- Window Controls -->
    <circle cx="20" cy="20" r="4.5" fill="#ef4444" opacity="0.8"/>
    <circle cx="35" cy="20" r="4.5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="50" cy="20" r="4.5" fill="#10b981" opacity="0.8"/>
    <text x="72" y="24" fill="#64748b" font-family="Consolas, monospace" font-size="11.5">system-topology // production-mesh</text>
    <line x1="0" y1="38" x2="430" y2="38" stroke="#1e293b" stroke-width="1"/>

    <!-- Topology Nodes -->
    <!-- Node 1: API Gateway -->
    <rect x="28" y="60" width="112" height="52" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2"/>
    <text x="42" y="82" fill="#38bdf8" font-family="Consolas, monospace" font-size="11" font-weight="700">API GATEWAY</text>
    <text x="42" y="99" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">OAuth2 · gRPC</text>

    <!-- Node 2: Domain Services -->
    <rect x="168" y="54" width="124" height="64" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.2"/>
    <text x="182" y="76" fill="#818cf8" font-family="Consolas, monospace" font-size="11" font-weight="700">MICROSERVICES</text>
    <text x="182" y="93" fill="#e2e8f0" font-family="Consolas, monospace" font-size="10">FastAPI · Spring</text>
    <text x="182" y="107" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">.NET Core · Go</text>

    <!-- Node 3: Event Streaming -->
    <rect x="168" y="142" width="124" height="56" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.2"/>
    <text x="182" y="164" fill="#34d399" font-family="Consolas, monospace" font-size="11" font-weight="700">EVENT MESH</text>
    <text x="182" y="182" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">Kafka · RabbitMQ</text>

    <!-- Node 4: Data & Cache -->
    <rect x="316" y="60" width="90" height="138" rx="8" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <text x="330" y="84" fill="#f8fafc" font-family="Consolas, monospace" font-size="11" font-weight="700">DATA TIER</text>
    <text x="330" y="106" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">PostgreSQL</text>
    <text x="330" y="124" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">Redis</text>
    <text x="330" y="142" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">SQL Server</text>
    <text x="330" y="160" fill="#94a3b8" font-family="Consolas, monospace" font-size="10">Elastic</text>
    <text x="330" y="178" fill="#38bdf8" font-family="Consolas, monospace" font-size="10">Vector DB</text>

    <!-- Connectors -->
    <line x1="140" y1="86" x2="168" y2="86" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="230" y1="118" x2="230" y2="142" stroke="#818cf8" stroke-width="1.5" stroke-dasharray="3,3"/>
    <line x1="292" y1="86" x2="316" y2="86" stroke="#818cf8" stroke-width="1.5"/>
    <line x1="292" y1="170" x2="316" y2="170" stroke="#34d399" stroke-width="1.5"/>

    <!-- Bottom Telemetry Bar -->
    <rect x="28" y="216" width="378" height="36" rx="6" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
    <circle cx="46" cy="234" r="4" fill="#34d399"/>
    <text x="58" y="238" fill="#cbd5e1" font-family="Consolas, monospace" font-size="11">EKS / AKS Cluster  |  p95 &lt; 50ms  |  Zero-Trust IAM</text>
  </g>
</svg>
